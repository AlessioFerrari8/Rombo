appId: it.alessio.rombo
productName: Rombo
copyright: Copyright © 2026 Alessio Ferrari
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - web/dist/frontend/browser/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# doppio clic su un .rombo apre Rombo (stesso JSON dell'export "File diagramma").
# Icone .ico/.icns pregenerate (tools/make-icon.py): l'icon-tool di electron-builder crashava su Windows (exit 3221225477).
# il mimeType finisce da solo nel MimeType del .desktop su linux.
fileAssociations:
  - ext: rombo
    name: Diagramma Rombo
    description: Diagramma entità-relazione Rombo
    mimeType: application/x-rombo
    role: Editor

win:
  icon: build/icon.ico
  target:
    - { target: nsis, arch: [x64] }
    - { target: msi, arch: [x64] }
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
msi:
  oneClick: false
  perMachine: false

linux:
  icon: build/icon.png
  category: Development
  synopsis: Editor di diagrammi entità-relazione
  description: Editor di diagrammi entità-relazione in notazione Chen, con validazione, schema logico e SQL. Funziona offline.
  maintainer: Alessio Ferrari <alessioferrari374@gmail.com>
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [x64, arm64] }
dmg:
  title: Rombo ${version}

<nav class="ui-rail" aria-label="Strumenti">
  @for (it of items(); track it.tool) {
    <div class="ui-tooltip" [attr.data-tip]="it.label + ' (' + it.key + ') — ' + it.hint">
      <button
        type="button"
        class="ui-tool"
        [class.is-active]="store.tool() === it.tool"
        [disabled]="store.readonly() && it.tool !== 'select'"
        [attr.aria-pressed]="store.tool() === it.tool"
        [attr.aria-label]="it.label"
        (click)="choose(it.tool)"
      >
        @switch (it.tool) {
          @case ('select') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z" /></svg>
          }
          @case ('entity') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3" /></svg>
          }
          @case ('relationship') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 8-9 8-9-8z" /></svg>
          }
          @case ('attribute') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20l9-9" /><circle cx="16" cy="8" r="4" /></svg>
          }
          @case ('isa') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M5 21v-5h14v5M12 3l-3 3M12 3l3 3" /></svg>
          }
          @case ('table') {
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 9h18M3 14.5h18M9 9v11" /></svg>
          }
        }
        <span class="ui-tool-key" aria-hidden="true">{{ it.key }}</span>
      </button>
    </div>
  }
  <div class="my-1.5 h-px w-6 bg-line" role="presentation"></div>
  <div class="ui-tooltip" data-tip="Sistema il layout (L)">
    <button type="button" class="ui-tool" aria-label="Sistema il layout" [disabled]="store.readonly() || store.layingOut()" (click)="layout()">
      @if (store.layingOut()) {
        <span class="ui-spinner ui-spinner-sm"></span>
      } @else {
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="5" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="8.5" y="16" width="7" height="5" rx="1" /><path d="M6.5 8v3h11V8M12 11v5" /></svg>
      }
      <span class="ui-tool-key" aria-hidden="true">L</span>
    </button>
  </div>
</nav>

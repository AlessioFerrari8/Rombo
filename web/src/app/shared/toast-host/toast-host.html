<div class="ui-toasts" aria-live="polite">
  @for (t of toasts.items(); track t.id) {
    <div
      role="alert"
      class="ui-toast"
      [class.ui-toast-info]="t.kind === 'info'"
      [class.ui-toast-success]="t.kind === 'success'"
      [class.ui-toast-warning]="t.kind === 'warning'"
      [class.ui-toast-error]="t.kind === 'error'"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (t.kind) {
          @case ('success') { <circle cx="12" cy="12" r="9" /><path d="M8 12l3 3 5-6" /> }
          @case ('warning') { <path d="M12 4l9 16H3z" /><path d="M12 10v4M12 17h.01" /> }
          @case ('error') { <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5.5M12 16.5h.01" /> }
          @default { <circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.5h.01" /> }
        }
      </svg>
      <span class="min-w-0 flex-1 py-px">{{ t.text }}</span>
      <button type="button" class="ui-btn ui-btn-ghost ui-btn-xs ui-btn-icon -my-0.5" aria-label="Chiudi" (click)="toasts.dismiss(t.id)">
        <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  }
</div>

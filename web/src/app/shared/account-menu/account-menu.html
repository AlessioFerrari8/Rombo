@if (auth.user(); as me) {
  <div class="ui-dropdown">
    <div tabindex="0" role="button" class="grid size-9 place-items-center rounded-full transition-[box-shadow] duration-150 hover:ring-4 hover:ring-accent/15" [attr.aria-label]="'Account di ' + me.email">
      <span class="grid size-8 place-items-center rounded-full bg-accent font-display text-sm font-bold text-on-accent">{{ me.email.charAt(0).toUpperCase() }}</span>
    </div>
    <ul tabindex="0" class="ui-menu">
      <li class="ui-menu-title">{{ me.email }}</li>
      <li>
        <button type="button" class="ui-menu-item" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 16l-4-4 4-4M6 12h10" /></svg>
          Esci
        </button>
      </li>
      <li class="ui-divider" role="presentation"></li>
      <li>
        <button type="button" class="ui-menu-item is-danger" (click)="askDelete()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="text-current"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3" /></svg>
          Elimina account…
        </button>
      </li>
    </ul>
  </div>
} @else if (auth.user() === null) {
  <a routerLink="/accedi" class="ui-btn ui-btn-ghost ui-btn-sm">Accedi</a>
}

<dialog #confirmDelete class="ui-modal" aria-labelledby="del-account-title">
  <div class="ui-modal-box">
    <h2 id="del-account-title" class="ui-modal-title">Eliminare l'account?</h2>
    <p class="ui-modal-body">Spariscono l'account, tutti i diagrammi salvati sul server e i link condivisi. Su questo dispositivo restano solo le bozze mai caricate.</p>
    <div class="ui-modal-actions">
      <form method="dialog"><button class="ui-btn">Annulla</button></form>
      <button type="button" class="ui-btn ui-btn-danger-solid" (click)="deleteAccount()">Elimina tutto</button>
    </div>
  </div>
</dialog>
